name: Phase 20 Dashboard Verification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall backend

      - name: Verify dashboard API registration
        env:
          DATABASE_URL: sqlite:///./phase20_ci.db
          JWT_SECRET_KEY: phase20-ci-secret
        run: python -c "from backend.app.main import app; paths={r.path for r in app.routes}; required={'/api/dashboard/summary','/api/dashboard/detections','/api/dashboard/alerts','/api/dashboard/security-events'}; missing=required-paths; assert not missing, missing; print('Dashboard routes verified:', sorted(required))"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend production build
        working-directory: frontend
        run: npm run build
